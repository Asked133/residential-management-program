name: Flutter CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'mobile/**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  test:
    name: Unit and Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          echo "SUPABASE_URL=https://qunkgbmxmxmjponyxzdu.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=sb_publishable_2an39B-QMQpwkuaCYfg1Bw_EgWoC-SF" >> .env
          echo "API_BASE_URL=https://residential-management-program-1.onrender.com" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "ADMIN_USER_EMAIL=${{ secrets.ADMIN_USER_EMAIL }}" >> .env
          echo "ADMIN_USER_PASSWORD=${{ secrets.ADMIN_USER_PASSWORD }}" >> .env

      - name: Analyze code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Notify Discord on Success/Failure
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="65280"
          else
            EMOJI="❌"
            COLOR="16711680"
          fi
          
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "'$EMOJI' CI/CD: Unit & Widget Tests '$STATUS'",
              "description": "Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}",
              "color": '$COLOR'
            }]
          }' \
          https://discord.com/api/webhooks/1545292672137302078/sRjwddHW0pXAndT-B7Wj6QFGC5CV6I52q9r1SyMiRKcMaAk1_LuGkDTVp5hnauQysobO

  integration_test_web:
    name: Web Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          echo "SUPABASE_URL=https://qunkgbmxmxmjponyxzdu.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=sb_publishable_2an39B-QMQpwkuaCYfg1Bw_EgWoC-SF" >> .env
          echo "API_BASE_URL=https://residential-management-program-1.onrender.com" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "ADMIN_USER_EMAIL=${{ secrets.ADMIN_USER_EMAIL }}" >> .env
          echo "ADMIN_USER_PASSWORD=${{ secrets.ADMIN_USER_PASSWORD }}" >> .env

      - name: Setup Chrome for testing
        run: sudo apt-get install google-chrome-stable

      - name: Run Web integration tests
        run: flutter test integration_test/app_test.dart -d web-server

      - name: Notify Discord on Integration Test
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="65280"
          else
            EMOJI="❌"
            COLOR="16711680"
          fi
          
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "'$EMOJI' CI/CD: Web Integration Tests '$STATUS'",
              "description": "Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}",
              "color": '$COLOR'
            }]
          }' \
          https://discord.com/api/webhooks/1545292672137302078/sRjwddHW0pXAndT-B7Wj6QFGC5CV6I52q9r1SyMiRKcMaAk1_LuGkDTVp5hnauQysobO

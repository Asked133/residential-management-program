name: Google Play Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

jobs:
  build-and-deploy:
    name: Build & Deploy to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Increment Version Code
        run: |
          # This perl script increments the build number (the number after the +)
          perl -i -pe 's/^(version:\s+\d+\.\d+\.\d+\+)(\d+)$/$1.($2+1)/e' pubspec.yaml
          
      - name: Create Pull Request for Version Bump
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version code for release [skip ci]"
          title: "chore: bump version code for release"
          branch: "chore/bump-version"
          body: "Automated version bump triggered by Google Play Deploy workflow."
          add-paths: mobile/pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env
        run: touch .env

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.haven.uaq
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
